services:
  mongodb:
    image: mongo:7-jammy
    container_name: plataforma-acarreo-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: plataforma_acarreo
    volumes:
      - mongo_data:/data/db
    networks:
      - plataforma-network

  # Redis para WebSocket y caché
  redis:
    image: redis:7-alpine
    container_name: plataforma-acarreo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - plataforma-network

volumes:
  mongo_data:
    driver: local

networks:
  plataforma-network:
    driver: bridge